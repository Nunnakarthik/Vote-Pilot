<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote Pilot — Your Step-by-Step Election Guide</title>
  <meta name="description" content="AI-powered election education assistant using Google Gemini, Maps, Calendar & Translate. Learn voting processes interactively." />
  <meta name="keywords" content="election, voting, civic education, voter registration, AI assistant, Google Gemini" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🧭</text></svg>" />
  <link rel="stylesheet" href="/src/styles/variables.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/chat.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/animations.css" />
  <link rel="stylesheet" href="/src/styles/auth.css" />

  <!-- Google Translate -->
  <script>
    function googleTranslateElementInit() {
      if (window.initGoogleTranslate) {
        window.initGoogleTranslate();
      } else {
        window._googleTranslateReady = true;
      }
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:8000 https:; img-src 'self' data: https:; font-src 'self' https: data:;">
  <style>
    /* Hide Google Translate bar */
    .goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
    .goog-te-gadget { font-family: inherit !important; }
    .goog-te-gadget-simple { background: rgba(255,255,255,0.04) !important; border: 1px solid rgba(148,163,184,0.15) !important; border-radius: 8px !important; padding: 4px 8px !important; }
    .goog-te-gadget-simple span { color: var(--text-secondary, #94a3b8) !important; font-size: 12px !important; }
    /* Voice btn */
    .voice-btn { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); transition:all 0.25s ease; flex-shrink:0; }
    .voice-btn:hover { color:var(--accent-primary); background:rgba(0,229,255,0.08); }
    .voice-btn.listening { color:var(--accent-danger); background:rgba(239,68,68,0.1); animation:voicePulse 1s ease-in-out infinite; }
    @keyframes voicePulse { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,0.3); } 50% { box-shadow:0 0 0 8px rgba(239,68,68,0); } }
    /* Speak btn */
    .speak-btn { position:absolute; top:8px; right:8px; background:none; border:none; cursor:pointer; font-size:0.75rem; opacity:0.4; transition:opacity 0.2s; padding:4px; }
    .speak-btn:hover { opacity:1; }
    .message-content { position:relative; }
    /* Gemini toggle */
    .main-header {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-base) var(--space-2xl);
  height: var(--header-height);
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(7, 11, 26, 0.8);
  backdrop-filter: blur(var(--glass-blur));
  z-index: 5;
  flex-shrink: 0;
  position: relative;
}
.header-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.header-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.header-subtitle {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent-primary);
  text-transform: uppercase;
  letter-spacing: 0.15em;
}
    .gemini-toggle { display:flex; align-items:center; gap:6px; padding:4px 10px; background:rgba(255,255,255,0.03); border:1px solid rgba(148,163,184,0.1); border-radius:20px; font-size:0.65rem; color:var(--text-muted); cursor:pointer; transition:all 0.25s; }
    .gemini-toggle:hover { border-color:var(--accent-primary); color:var(--accent-primary); }
    .gemini-dot { width:6px; height:6px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }
    .chat-footer-text { font-size:0.6rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; }
  </style>
</head>
<body>
  <div id="app" style="visibility:hidden;opacity:0;transition:opacity 0.5s ease;">
    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo" id="logo-btn">
          <div class="logo-icon">🧭</div>
        </div>
        <button id="new-chat-btn" class="btn-new-chat">+ New Chat</button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#" class="nav-item active" data-view="home" id="nav-home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item" data-view="timeline" id="nav-timeline">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Election Dates</span>
        </a>
        <a href="#" class="nav-item" data-view="guide" id="nav-guide">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>How to Vote</span>
        </a>
        <a href="#" class="nav-item" data-view="faq" id="nav-faq">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Common Questions</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile" id="user-profile">
          <div class="user-avatar">👤</div>
          <div class="user-info">
            <span class="user-name">Alex Rivera</span>
            <span class="user-role">Voter</span>
          </div>
          <button class="btn-logout" id="btn-logout" aria-label="Sign out of Vote Pilot" title="Sign Out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <main id="main-content" class="main-content">
      <header id="main-header" class="main-header">
        <div class="header-left">
          <h1 class="header-title" id="header-title">Voting Helper</h1>
          <span class="header-subtitle" id="header-subtitle">Ask a question</span>
        </div>
      </header>
      <div id="view-container" class="view-container"></div>
    </main>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
